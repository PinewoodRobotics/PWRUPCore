plugins {
    id "java-library"
    id "maven-publish"
    id "org.wpilib.GradleRIO" version "2027.0.0-alpha-7"
    id "com.google.protobuf" version "0.10.0"
}

def protobufVersion = "3.25.8"
def lombokVersion = "1.18.42"

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven {
        url = "https://jitpack.io"
    }
}

// WPILib and vendordeps are compileOnly so they stay out of the jar and the published POM;
// the consuming robot project provides them through its own GradleRIO setup.
dependencies {
    annotationProcessor wpi.java.deps.wpilibAnnotations()
    compileOnly wpi.java.deps.wpilib()
    compileOnly wpi.java.vendor.java()

    testImplementation wpi.java.deps.wpilib()
    testImplementation wpi.java.vendor.java()

    nativeDebug wpi.java.deps.wpilibJniDebug(wpi.platforms.desktop)
    nativeDebug wpi.java.vendor.jniDebug(wpi.platforms.desktop)
    simulationDebug wpi.sim.enableDebug()

    nativeRelease wpi.java.deps.wpilibJniRelease(wpi.platforms.desktop)
    nativeRelease wpi.java.vendor.jniRelease(wpi.platforms.desktop)
    simulationRelease wpi.sim.enableRelease()

    api "com.google.protobuf:protobuf-java:${protobufVersion}"
    api 'com.github.godbrigero:autobahn_client:4c1ea78b06'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.ejml:ejml-all:0.46.0'
    implementation 'org.java-websocket:Java-WebSocket:1.5.3'
    implementation 'com.googlecode.json-simple:json-simple:1.1.1'
    implementation 'org.jmdns:jmdns:3.5.7'

    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    systemProperty 'junit.jupiter.extensions.autodetection.enabled', 'true'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.add '-XDstringConcat=inline'
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${protobufVersion}"
    }
    generateProtoTasks {
        all().configureEach { task ->
            task.builtins {
                java {
                    option 'lite'
                }
            }
        }
    }
}

sourceSets {
    main {
        proto {
            srcDir 'src/proto'
        }
    }
}
